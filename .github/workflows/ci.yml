# Continuous integration.
#
# Early weeks this mostly checks that you have not committed a secret or a
# huge file. Add real tests when you have code worth testing - by Week 4 you
# need at least ten test cases with results.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    name: Nothing that should not be here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::A .env file is committed. Remove it, rotate the key, and tell a mentor."
            exit 1
          fi
          echo "No .env file in the repository."

      - name: Fail on files over 25 MB
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +25M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::These files are too big for git: $big"
            echo "Datasets and model weights belong outside the repository. See data/README.md."
            exit 1
          fi
          echo "No oversized files."

  python:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import src.load_data; print('src imports cleanly')"

      - name: Test
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            pip install pytest
            pytest -q
          else
            echo "No tests yet. Expected early on - add them as your code grows."
          fi
